<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Admin Platform</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#F59E0B", // Amber 500
                        primary_hover: "#D97706", // Amber 600
                        "background-light": "#F8FAFC", // Slate 50
                        "background-dark": "#0F172A", // Slate 900 (Deep Blue Identity)
                        "surface-light": "#FFFFFF",
                        "surface-dark": "#1E293B", // Slate 800
                        "surface-highlight": "#334155", // Slate 700
                        "border-dark": "#334155", // Slate 700
                    },
                    fontFamily: {
                        sans: ["Tajawal", "sans-serif"],
                        display: ["Tajawal", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.5rem",
                        'xl': '1rem',
                        '2xl': '1.5rem',
                    },
                },
            },
        };
    </script>
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #020617; /* Very Dark Blue Base */
            
            /* Combined Background: Islamic Pattern Overlay + Deep Radial Gradient */
            background-image: 
                /* Islamic Geometric Pattern (SVG) - Subtle White/Blue Lines */
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg stroke='%2394a3b8' stroke-width='0.5' stroke-opacity='0.08'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"),
                /* Deep Dark Blue Gradient */
                radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 50%, #020617 100%);
            
            background-size: 60px 60px, cover;
            background-position: center, center;
            background-attachment: fixed, fixed;
            background-repeat: repeat, no-repeat;
            min-height: 100vh;
        }
        
        /* Subtle noise texture overlay for matte finish */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            opacity: 0.3;
            z-index: -1;
            pointer-events: none;
        }

        /* Decorative Side Borders (Large Corner Watermark) */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -2;
            /* Large abstract geometric arc */
            background-image: url("data:image/svg+xml,%3Csvg width='500' height='500' viewBox='0 0 500 500' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23ffffff' stroke-width='1.5' stroke-opacity='0.03'%3E%3Ccircle cx='500' cy='0' r='400'/%3E%3Ccircle cx='500' cy='0' r='380'/%3E%3Ccircle cx='500' cy='0' r='350' stroke-dasharray='10 20'/%3E%3Cpath d='M100 0 L500 400' stroke-opacity='0.02'/%3E%3C/g%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: top right;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5); 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569; 
        }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
</head>
  <body class="text-slate-800 dark:text-slate-200 transition-colors duration-200 min-h-screen dark">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
